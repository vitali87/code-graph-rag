[package]
name = "cgr_graph_rs"
version = "0.1.16"
edition = "2021"
description = "Native acceleration for code-graph-rag: its embedded graph, and its indexer's tree walks"
license = "MIT"
publish = false

[lib]
name = "cgr_graph_rs"
crate-type = ["cdylib", "rlib"]

[features]
# The Python module, built by maturin; `cargo test` leaves it off and so
# needs no interpreter to link against.
python = ["dep:pyo3", "pyo3/extension-module"]
default = []

[dependencies]
blake2 = "0.11"
# The engine's file hashes, the md5 the sync records (src/engine).
md-5 = "0.11"
pyo3 = { version = "0.30", features = ["abi3-py312"], optional = true }
# The engine's thread pool (src/engine).
rayon = "1.12"
# The ignore rules' patterns (src/engine/ignore), a port of pathspec's
# gitignore regexes. Already in the build through tree-sitter, with the
# same features, so this adds no crate.
regex = "1.12"
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.11"
# The tree walks (src/trees) read the trees py-tree-sitter built, so this
# runtime must lay out and walk a tree exactly as the one compiled into the
# `tree-sitter` wheel cgr pins does: 0.27.2's node, tree, cursor, subtree
# and language sources are byte-identical to py-tree-sitter 0.27.0's. Bump
# the two together, as AGENTS.md describes; `TreeBridge` refuses any other
# py-tree-sitter version, and test_native_trees.py any other pair of pins.
tree-sitter = "=0.27.2"
# The grammars compiled in (src/grammars, PHASE2_FRAME.md section 11), each
# exactly as uv.lock holds its Python package: Go's release, and the patched
# C and C++ forks (issues #555 and #2424) at their commits, from git because
# crates.io has only the unpatched ones. The parser loader hands py-tree-sitter
# the C and C++ grammars compiled here, so both engines parse them alike on
# every install. Each moves with its Python pin, by hand (AGENTS.md);
# test_grammar_pins.py fails while the two disagree.
tree-sitter-c = { git = "https://github.com/vitali87/tree-sitter-c", rev = "fa327ad98f847f8173fc46926be4165c7971f960" }
tree-sitter-cpp = { git = "https://github.com/vitali87/tree-sitter-cpp", rev = "b4a7be2f62f36dd460a14b2d1728d42d81d2c486" }
tree-sitter-go = "=0.25.0"
# The grammars' entry points (`LanguageFn`). Already in the build through
# tree-sitter, so this adds no crate.
tree-sitter-language = "0.1"

# The engine's state files (src/engine/state): `O_NOFOLLOW` for the temporary
# cache, and `ELOOP` among the errors that say a path is gone. Already linked
# through pyo3, so this adds no crate to the wheel.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tree-sitter-python = "=0.25.0"

[profile.release]
lto = "thin"
codegen-units = 4
opt-level = 3
