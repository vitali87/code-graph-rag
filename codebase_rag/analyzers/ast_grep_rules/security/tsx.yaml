# ast-grep security rules for TSX (issue #413).
ast_grep_id: tsx
extensions: [.tsx]
rules:
  # A constant string or a template with no ${...} cannot carry data into the
  # DOM, and `el.innerHTML = ''` (clearing an element) is the commonest use of
  # the sink; flagging those buried the interpolated hits (issue #2533).
  - id: innerhtml_xss
    message: "Possible XSS: assignment to innerHTML/outerHTML"
    rule:
      all:
        - any:
            - pattern: "$EL.innerHTML = $X"
            - pattern: "$EL.innerHTML += $X"
            - pattern: "$EL.outerHTML = $X"
            - pattern: "$EL.outerHTML += $X"
        - not:
            has:
              field: right
              any:
                - kind: string
                - kind: template_string
                  not: { has: { kind: template_substitution } }
  - id: eval_use
    message: "eval() executes arbitrary code"
    rule:
      pattern: "eval($$$)"
  - id: document_write
    message: "document.write() can enable XSS"
    rule:
      all:
        - pattern: "document.write($$$)"
        # Flag only when some argument can carry data. nthChild counts named
        # nodes only, which skips the `(` `,` `)` tokens of the argument list.
        - has:
            field: arguments
            has:
              nthChild: "n+1"
              not:
                any:
                  - kind: string
                  - kind: template_string
                    not: { has: { kind: template_substitution } }
  - id: hardcoded_secret
    # A name is bound to a literal by a declarator, an assignment to a
    # variable, member or subscript (the member's own name decides:
    # `token.value = ...` sets a value), an object property or a class
    # field; matching only the declarator missed `this.token = "..."`
    # and `{ password: "..." }` (issue #2866).
    message: "Hardcoded secret assigned to a credential-named variable"
    rule:
      any:
        - kind: variable_declarator
          all:
            - has: { field: name, regex: '(?i)(password|secret|api_key|token)' }
            - has:
                field: value
                all:
                  - any:
                      - kind: string
                      # A backtick literal with no `${...}` is as constant
                      # as a quoted one (issue #2779).
                      - kind: template_string
                        not: { has: { kind: template_substitution } }
                  - regex: '^.{10,}$'
                  - not:
                      any:
                        - regex: '\{[^{}]*\}'
                        - regex: '%[sdrifeEgGxXoc(]'
        - kind: assignment_expression
          all:
            - has:
                field: left
                any:
                  - { kind: identifier, regex: '(?i)(password|secret|api_key|token)' }
                  - kind: member_expression
                    has: { field: property, regex: '(?i)(password|secret|api_key|token)' }
                  - kind: subscript_expression
                    has: { field: index, regex: '(?i)(password|secret|api_key|token)' }
            - has:
                field: right
                all:
                  - any:
                      - kind: string
                      # A backtick literal with no `${...}` is as constant
                      # as a quoted one (issue #2779).
                      - kind: template_string
                        not: { has: { kind: template_substitution } }
                  - regex: '^.{10,}$'
                  - not:
                      any:
                        - regex: '\{[^{}]*\}'
                        - regex: '%[sdrifeEgGxXoc(]'
        - kind: pair
          all:
            - has: { field: key, regex: '(?i)(password|secret|api_key|token)' }
            - has:
                field: value
                all:
                  - any:
                      - kind: string
                      # A backtick literal with no `${...}` is as constant
                      # as a quoted one (issue #2779).
                      - kind: template_string
                        not: { has: { kind: template_substitution } }
                  - regex: '^.{10,}$'
                  - not:
                      any:
                        - regex: '\{[^{}]*\}'
                        - regex: '%[sdrifeEgGxXoc(]'
        - kind: public_field_definition
          all:
            - has: { field: name, regex: '(?i)(password|secret|api_key|token)' }
            - has:
                field: value
                all:
                  - any:
                      - kind: string
                      # A backtick literal with no `${...}` is as constant
                      # as a quoted one (issue #2779).
                      - kind: template_string
                        not: { has: { kind: template_substitution } }
                  - regex: '^.{10,}$'
                  - not:
                      any:
                        - regex: '\{[^{}]*\}'
                        - regex: '%[sdrifeEgGxXoc(]'
