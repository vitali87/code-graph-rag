name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR supersedes the queued or running analysis of the
# previous head; cancelling it keeps the runner queue for live heads.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}-{2}', github.event_name, github.sha, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    # The PR author, not github.actor: the actor is whoever triggered the run
    # (e.g. a maintainer pushing to a Dependabot PR), and the sonar-gate job in
    # ci.yml mirrors this condition, so both must key on the same field.
    if: github.event_name == 'push' || (github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # The coverage run of the full suite alone now takes 26-47 min depending on
    # the runner, and the scan 2-4 min more, so a 50 min cap cut the scan off
    # and the Sonar gate never saw an analysis.
    timeout-minutes: 70

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        # The go/types helper's tests build it with the Go on PATH, and the
        # runner image's Go is older than the floor in gotypes/go.mod.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ">=1.27.2"
          cache-dependency-path: codebase_rag/parsers/go_frontend/gotypes/go.sum

      - name: Key the uv cache on dependencies, not the project version
        shell: bash
        run: |
          awk 'skip && /^version = / { skip = 0; next }
               { skip = /^name = "code-graph-rag"\r?$/; print }' \
            uv.lock > "$RUNNER_TEMP/uv-deps.lock"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: ${{ runner.temp }}/uv-deps.lock

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra treesitter-full --extra test --extra semantic --extra milvus --group dev

      # This job runs the same unit suite as ci.yml, so it hits the same
      # embedding-model download and the same 429s (issue #1092).
      - name: Cache HuggingFace hub
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-unixcoder-base-${{ runner.os }}-v1

      - name: Prefetch embedding model
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if uv run --no-sync python -c "
          from huggingface_hub import snapshot_download
          snapshot_download('microsoft/unixcoder-base')
          "; then
              exit 0
            fi
            echo "prefetch attempt $attempt failed; retrying"
            sleep $((attempt * 15))
          done
          echo "could not fetch the embedding model after 3 attempts"
          exit 1

      - name: Run tests with coverage
        run: uv run pytest -n auto -m "not integration" --tb=short --cov=codebase_rag --cov-report=xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
