name: Require CI At Head

# A required status check that is ABSENT does not block a merge -- GitHub
# cannot fail a check nobody reported. `All Checks Pass` is a job inside
# ci.yml, so whenever ci.yml does not run at a PR's head that job simply
# does not exist, the ruleset's only requirement is vacuously satisfied,
# and the PR reports CLEAN with no tests having run (issue #1582).
#
# Measured on #1551: mergeStateStatus CLEAN, mergeable MERGEABLE, 7 checks
# present, `All Checks Pass` among them: no. Zero unit tests had ever run
# on that branch.
#
# This workflow exists to be PRESENT where ci.yml is not. It has no
# `branches` filter, so it reports on every pull request, and it fails
# unless a CI run exists at the exact head SHA. That is the base-agnostic
# formulation issue #1582 settled on: it does not depend on why any given
# run fired, only on whether one covers the commit being merged.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  require-ci-at-head:
    name: CI Ran At Head
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert a CI run exists at this PR's head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # A missing head SHA must NOT be a pass. `workflow_dispatch`
          # carries no pull_request payload, so an earlier `exit 0` here
          # let anyone manufacture a green `CI Ran At Head` by dispatching
          # this workflow by hand -- a gate that reports success without
          # asserting anything, which is the exact defect it exists to
          # prevent.
          if [ -z "${HEAD_SHA:-}" ]; then
            echo "::error::No pull_request head SHA in the event payload."
            echo "This check asserts a property of a pull request head and"
            echo "cannot do so outside a pull_request event. Dispatching it"
            echo "manually proves nothing and must not report success."
            exit 1
          fi

          if [ -z "${HEAD_BRANCH:-}" ] || [ -z "${HEAD_REPO:-}" ] ||
             [ -z "${REPO:-}" ] || ! [[ "${PR_NUMBER:-}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Incomplete pull_request source identity in the event payload."
            exit 1
          fi

          echo "Head SHA: $HEAD_SHA"
          echo "PR #$PR_NUMBER source: $HEAD_REPO:$HEAD_BRANCH"

          # Query by head_sha rather than by branch. After a stack rebase
          # several branches share a head, so `gh run list --branch` returns
          # runs belonging to OTHER PRs (issue #1582 records this trap).
          # --paginate: without it only the first 100 runs come back, and a
          # matching run on a later page reads as "no run at this head".
          # NOT --slurp: gh rejects it alongside --jq. With --jq, gh applies
          # the filter per page and concatenates, so `.workflow_runs[]`
          # yields every run across all pages.
          runs=$(gh api --paginate \
            "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&per_page=100" \
            --jq '.workflow_runs[]
                  | {name, path, conclusion, status, event, created_at, head_sha, head_branch,
                     head_repo: .head_repository.full_name,
                     prs: [.pull_requests[].number]}' \
            | jq -s '.')

          echo "Runs at this head:"
          echo "$runs" | jq -r '.[] | "  \(.path) [\(.name)] source=\(.head_repo):\(.head_branch) PRs=\(.prs|tostring): \(.status)/\(.conclusion // "pending") (\(.event))"' || true

          # Match the workflow's PATH, not its display `name`. A display
          # name is just a string any workflow may declare, so a second
          # file named `CI` would satisfy a name-only check without
          # running a single test. The path identifies the file itself.
          #
          # `| length == 0` is also indistinguishable from "nothing
          # matched the filter", so every run found is printed above
          # whether the assertion passes or fails.
          # A head SHA identifies a COMMIT, not a pull request. After a
          # stack rebase several branches share a head (issue #1582 records
          # this), so a run at this SHA may belong to a different PR
          # entirely. Match the source repository and branch as well.
          ci_runs=$(echo "$runs" | jq \
            --arg sha "$HEAD_SHA" --arg branch "$HEAD_BRANCH" \
            --arg head_repo "$HEAD_REPO" \
            '[.[] | select(.path == ".github/workflows/ci.yml")
                  | select(.head_sha == $sha and .head_branch == $branch
                           and .head_repo == $head_repo)]')
          ci_count=$(echo "$ci_runs" | jq --argjson pr "$PR_NUMBER" \
            '[.[] | select(.prs | index($pr))] | length')

          # Fork runs permanently have pull_requests: [] (#1866). Source
          # identity alone is insufficient: the same fork branch can open
          # multiple PRs, even against different bases. Only infer the PR
          # when that exact source branch has belonged to this PR alone
          # across ALL history. Closed PRs and different historical SHAs
          # still create ambiguity; branch reuse requires a fresh branch.
          if [ "$ci_count" -eq 0 ] && [ "$HEAD_REPO" != "$REPO" ]; then
            head_filter=$(jq -rn --arg head "${HEAD_REPO%%/*}:$HEAD_BRANCH" '$head | @uri')
            source_prs=$(gh api --paginate \
              "repos/$REPO/pulls?state=all&head=$head_filter&per_page=100" \
              --jq 'if type != "array" then error("Invalid PR history page") else .[] end
                    | {number, created_at, head_repo: .head.repo.full_name,
                       head_branch: .head.ref, head_sha: .head.sha}' \
              | jq -s --arg head_repo "$HEAD_REPO" --arg branch "$HEAD_BRANCH" '
                  map(if (.number | type) != "number" or .number <= 0
                           or .number != (.number | floor)
                           or any(.head_repo, .head_branch, .head_sha, .created_at;
                                  type != "string" or length == 0)
                      then error("Incomplete PR history identity") else . end
                      | .created_at |= (. as $date | fromdateiso8601
                          | if todateiso8601 == $date then .
                            else error("Invalid PR creation timestamp") end))
                  | map(select(.head_repo == $head_repo and .head_branch == $branch))')
            pr_created_at=$(echo "$source_prs" | jq \
              --argjson pr "$PR_NUMBER" --arg sha "$HEAD_SHA" '
                if length == 1 and .[0].number == $pr and .[0].head_sha == $sha
                then .[0].created_at else empty end')

            if [ -n "$pr_created_at" ]; then
              ci_count=$(echo "$ci_runs" | jq --argjson created "$pr_created_at" '
                [.[] | select(.prs == [] and .event == "pull_request")
                     | select((.created_at | . as $date | fromdateiso8601
                         | if todateiso8601 == $date then .
                           else error("Invalid run creation timestamp") end) >= $created)]
                | length')
            else
              echo "Fork PR history does not uniquely identify this PR and head."
            fi
          fi

          if [ "$ci_count" -eq 0 ]; then
            echo
            # Say WHY, per run, rather than asserting absence. `ci_count`
            # reaches 0 through several different states -- no ci.yml run
            # at this head at all, one that ran for another PR after a
            # shared-head rebase, one whose PR association could not be
            # resolved -- and each wants a different response. Reporting
            # only the first sends a reader to `gh workflow run` when the
            # run already exists (issue #1948); the listing above shows it
            # while the error denies it.
            ci_at_head=$(echo "$runs" | jq -r \
              --arg sha "$HEAD_SHA" --arg branch "$HEAD_BRANCH" \
              --arg head_repo "$HEAD_REPO" --argjson pr "$PR_NUMBER" '
                [.[] | select(.path == ".github/workflows/ci.yml")] as $ci
                | if ($ci | length) == 0 then
                    "  no ci.yml run exists at this head"
                  else
                    $ci[] | "  ci.yml run: status=\(.status)/\(.conclusion // "pending")"
                      + " source=\(.head_repo):\(.head_branch) PRs=\(.prs|tostring)"
                      + " -- excluded because "
                      + (if (.head_sha != $sha) then "its head SHA differs"
                         elif (.head_branch != $branch or .head_repo != $head_repo)
                           then "it belongs to another source branch or repository"
                         elif ((.prs | index($pr)) | not)
                           then (if (.prs | length) == 0
                                 then "it carries no PR association and the source-branch fallback did not resolve it to this PR"
                                 else "its PR association names \(.prs|tostring), not this PR" end)
                         else "of an unrecognised condition" end)
                  end' 2>/dev/null) || ci_at_head="  (could not summarise runs)"
            echo "Why no run counted for this PR:"
            echo "$ci_at_head"
            # Compute the remedy's state in jq, from the DATA. Grepping the
            # rendered reason text re-derives state from a string that
            # interpolates head_branch, so a branch literally named
            # `status=queued` would flip the advice -- and a status the
            # grep does not list (`requested`, `pending`) would silently
            # fall through to the absent-case remedy. Restricted to runs
            # matching THIS PR's source identity, so a queued run belonging
            # to another PR cannot claim "one is already coming".
            ci_state=$(echo "$runs" | jq -r \
              --arg sha "$HEAD_SHA" --arg branch "$HEAD_BRANCH" \
              --arg head_repo "$HEAD_REPO" '
                [.[] | select(.path == ".github/workflows/ci.yml")
                     | select(.head_sha == $sha and .head_branch == $branch
                              and .head_repo == $head_repo)]
                | if length == 0 then "absent"
                  elif any(.[]; .status != "completed") then "pending"
                  else "foreign" end' 2>/dev/null) || ci_state="absent"
            echo
            echo "::error::No 'CI' workflow run matches PR #$PR_NUMBER at head $HEAD_SHA."
            echo "This PR has not been verified by the test suite at the commit"
            echo "being merged. A superseded run drops off the PR, leaving"
            echo "whatever happened to run at the current head -- often CodeQL"
            echo "alone -- which reads as a clean result (issue #1582)."
            echo
            # The remedy depends on the state above. Dispatching a run is
            # right only when none exists; when one is queued or waiting on
            # fork approval, a second dispatch adds a run without releasing
            # the first.
            if [ "$ci_state" = "absent" ]; then
              echo "Ensure ci.yml runs for this pull request's base branch."
              echo "Trigger one with:"
              echo "  gh workflow run ci.yml --ref <branch>"
              echo
              echo "Note: pushing an empty commit is NOT sufficient on a branch"
              echo "whose base is not main -- it creates a new head, CodeQL"
              echo "re-runs green, and the page looks freshly validated while no"
              echo "test has run."
            elif [ "$ci_state" = "pending" ]; then
              echo "A ci.yml run exists at this head but has not completed."
              echo "Do NOT dispatch another; it would not release this one."
              echo "On a fork PR this usually means the run is awaiting"
              echo "maintainer approval -- sibling runs reporting"
              echo "completed/action_required are the tell."
            else
              echo "Fork runs without PR associations require a source branch"
              echo "used by this PR alone; reused or shared branches are ambiguous."
              echo "A run naming a different PR is the shared-head case a"
              echo "rebase produces (issue #1582); it is not this PR's evidence."
            fi
            exit 1
          fi

          echo
          echo "Found $ci_count 'CI' run(s) at this head."

          # Existence is the assertion; whether they PASSED is `All Checks
          # Pass`'s job. Reporting the conclusion here would duplicate that
          # gate and disagree with it while a run is still in flight.
          exit 0
