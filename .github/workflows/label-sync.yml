name: Sync Labels

on:
  push:
    branches:
      - main
    paths:
      - ".github/labels.yml"
      - ".github/workflows/label-sync.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions: read-all

jobs:
  sync-labels:
    name: Sync Repository Labels
    # On our own servers when one has a free slot, on GitHub's
    # otherwise; forks and releases always on GitHub's: infra/runner-pool/README.md
    runs-on: >-
      ${{ vars.OWN_RUNNERS_FREE == 'true' && github.event_name != 'release'
      && !startsWith(github.ref, 'refs/tags/')
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && fromJSON('["self-hosted","own-linux"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sync labels
        uses: micnncim/action-label-syncer@3abd5ab72fda571e69fffd97bd4e0033dd5f495c # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          manifest: .github/labels.yml
          prune: false # Don't delete labels not in the manifest (preserve existing custom labels)
