name: Build Binaries

on:
  push:
    tags:
      - "v*"
  # Binaries are otherwise first exercised on a release tag, where a failure
  # ships a broken release (issue #1145). Build them pre-merge on any PR that
  # touches a build input, and weekly to surface upstream drift (dropped
  # wheels, resolver changes) that arrives without any repo commit.
  pull_request:
    paths:
      - ".github/workflows/build-binaries.yml"
      - "build_binary.py"
      - "scripts/generate_third_party_notices.py"
      - "scripts/bundle_contents.py"
      - "scripts/license_texts/**"
      - "main.py"
      - "codebase_rag/constants/build.py"
      - "**.spec"
      - "pyproject.toml"
      - "uv.lock"
      - "rust/cgr_graph_rs/**"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  release:
    types: [created]

permissions: read-all

# A new push to the same PR supersedes the queued or running analysis of the
# previous head; cancelling it keeps the runner queue for live heads.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}-{2}', github.event_name, github.sha, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A release tag's binaries go onto its GitHub release (the upload creates
  # one if none exists), so on a tag nothing builds until main's CI is shown
  # to have passed at that commit. PR, scheduled and branch builds publish
  # nothing and skip it.
  ci-gate:
    name: Require green CI at the release commit
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require green CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/require_green_ci.py "$GITHUB_SHA"

  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    needs: ci-gate
    if: >-
      !cancelled()
      && (needs.ci-gate.result == 'success' || !startsWith(github.ref, 'refs/tags/v'))
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: amd64
          - os: windows-latest
            platform: windows
            arch: amd64
          - os: macos-15-intel
            platform: darwin
            arch: amd64
          - os: macos-14
            platform: darwin
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # What a tag's run builds is published, so this workflow restores no
      # cache another run could have written. setup-uv's default would still
      # cache a dispatch, which publishes when dispatched on a tag.
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Install dependencies
        shell: bash
        run: |
          # cryptography ships no Intel macOS wheels since v50, so uv compiles it from
          # source on this leg. Statically link OpenSSL (as the official wheels do) so the
          # extension does not resolve against whichever libssl.3.dylib PyInstaller happens
          # to bundle — see issue #1143. The cache clean is required because uv's
          # built-wheel cache is not keyed by these env vars.
          if [ "${{ matrix.platform }}" = "darwin" ] && [ "${{ matrix.arch }}" = "amd64" ]; then
            export OPENSSL_DIR="$(brew --prefix openssl@3)"
            export OPENSSL_STATIC=1
            uv cache clean cryptography
          fi
          uv sync --extra treesitter-full --extra memgraph
          uv add --dev pyinstaller

      - name: Build binary
        run: uv run python build_binary.py

      # The one-file binary bundles every runtime dependency without the
      # wheels' licence files, so each binary ships a sidecar reproducing
      # them. The name shares the binary's prefix so the artifact, release
      # and signing globs below pick it up unchanged.
      - name: Generate third-party notices
        shell: bash
        run: |
          BINARY="dist/code-graph-rag-${{ matrix.platform }}-${{ matrix.arch }}"
          if [ "${{ matrix.platform }}" = "windows" ]; then
            BINARY="$BINARY.exe"
          fi
          # `--binary` filters a package's package-data licences to the
          # components PyInstaller actually bundled. Without it the notice
          # reproduces licences for excluded code: pywin32 vendors an
          # LGPL-2.1 `adodbapi` that nothing imports, and the notice asserted
          # copyleft terms over a binary carrying none. This step already runs
          # after `Build binary`, so the file is there on every platform.
          uv run python scripts/generate_third_party_notices.py \
            --binary "$BINARY" \
            --output "dist/code-graph-rag-${{ matrix.platform }}-${{ matrix.arch }}.THIRD_PARTY_NOTICES.txt"

      # A CycloneDX SBOM of the packages this platform's binary is built
      # from. The build environment also holds the dev group (pyinstaller,
      # pylint, semgrep, ...), which the binary never contains, so the SBOM
      # reads a second environment synced from the same lock with the same
      # extras and no dev group; every package is already in uv's cache. uv
      # evaluates the lock's markers for this runner, so pywin32 is listed
      # in the Windows SBOM only. Like the notices, the name shares the
      # binary's prefix so the upload, release and signing globs pick it up.
      - name: Generate SBOM
        shell: bash
        run: |
          SBOM_ENV="$RUNNER_TEMP/sbom-env"
          UV_PROJECT_ENVIRONMENT="$SBOM_ENV" uv sync --frozen --no-dev --no-install-project \
            --extra treesitter-full --extra memgraph
          uvx --from cyclonedx-bom==7.5.0 cyclonedx-py environment \
            --pyproject pyproject.toml --mc-type application --sv 1.6 \
            --output-file "dist/code-graph-rag-${{ matrix.platform }}-${{ matrix.arch }}.cdx.json" \
            "$SBOM_ENV"

      - name: Test binary
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            ./dist/code-graph-rag-${{ matrix.platform }}-${{ matrix.arch }}.exe --version
          else
            ./dist/code-graph-rag-${{ matrix.platform }}-${{ matrix.arch }} --version
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-graph-rag-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/code-graph-rag-*
          retention-days: 30
          compression-level: 9

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # The legs race to create the release when the tag has none yet; a
          # leg whose create loses that race finds the release the winner made.
          gh release view "$TAG" > /dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --title "$TAG" --notes "" \
            || gh release view "$TAG" > /dev/null
          gh release upload "$TAG" dist/code-graph-rag-* --clobber

  sign-release:
    name: Sign Release Artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Sign artifacts
        shell: bash
        run: |
          for f in artifacts/*; do
            [ -f "$f" ] || continue
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done

      - name: Upload signatures to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          signatures=(artifacts/*.sigstore.json)
          if [ "${#signatures[@]}" -gt 0 ]; then
            gh release upload "$TAG" "${signatures[@]}" --clobber
          fi

      - name: Generate build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/*
            !artifacts/*.sigstore.json

      - name: Stage provenance bundle
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" artifacts/multiple.intoto.jsonl

      - name: Upload provenance to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" artifacts/multiple.intoto.jsonl --clobber
