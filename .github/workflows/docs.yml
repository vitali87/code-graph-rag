name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
  # Rebuilds periodically so the GitHub repo widget (version, stars, forks)
  # stays current; MkDocs Material fetches these stats at build time.
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Key the uv cache on dependencies, not the project version
        shell: bash
        run: |
          awk 'skip && /^version = / { skip = 0; next }
               { skip = /^name = "code-graph-rag"\r?$/; print }' \
            uv.lock > "$RUNNER_TEMP/uv-deps.lock"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: ${{ runner.temp }}/uv-deps.lock

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group docs

      # Zensical never runs mkdocs.yml hooks, so the Credits page (#2175) is
      # written here rather than added mid-build as it was under MkDocs.
      - name: Generate Credits page
        run: uv run python scripts/generate_credits_page.py --output docs/credits.md

      - name: Build site
        run: uv run zensical build --strict

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only this job talks to Pages; the build job gets the workflow-level
    # contents: read and no OIDC token.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
