name: Poor Quality PR Management

# A daily sweep rather than a run per label event: commenting on a fork's
# pull request from a label-triggered run needs pull_request_target, which
# runs with a write token in reach of the pull request.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions: read-all

jobs:
  close-stale-poor-quality:
    name: Warn and Close Poor Quality PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Warn labelled PRs, and close those warned over 7 days ago
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const LABEL_NAME = 'poor-quality';
            const DAYS_THRESHOLD = 7;
            const BOT = 'github-actions[bot]';
            const WARNING_MARKER = '⚠️ **This PR has been marked as poor-quality.**';
            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - DAYS_THRESHOLD);

            const warning = (closeOn) => `${WARNING_MARKER}

            **Action Required:** This PR will be **automatically closed in 7 days** unless updated to meet our contribution standards.

            ### Required Actions:
            1. Review our [Contributing Guidelines](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CONTRIBUTING.md)
            2. Address the quality issues identified by reviewers
            3. Update this PR with the necessary changes
            4. Request a re-review once fixed

            ### Common Quality Issues:
            - ❌ Missing or inadequate tests
            - ❌ Code quality violations (run \`make lint\` and \`make format\`)
            - ❌ Type checking errors (run \`make typecheck\`)
            - ❌ Poor commit messages (must follow Conventional Commits)
            - ❌ Missing or inadequate documentation
            - ❌ AI-generated code without proper review
            - ❌ Does not follow project coding standards

            ### How to Fix:
            \`\`\`bash
            # Run these commands locally before pushing:
            make lint          # Check code quality
            make format        # Auto-format code
            make typecheck     # Check types
            make test-parallel # Run tests
            \`\`\`

            💡 **Need help?** Please ask questions in the comments, and we'll guide you.

            ---
            *This PR will be automatically closed on ${closeOn.toLocaleDateString()} if not updated.*`;

            console.log(`Checking for poor-quality PRs warned before ${cutoffDate.toISOString()}`);

            // Every page: the sweep is the only thing that warns, so a pull
            // request it does not see is never warned or closed.
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            let warnedCount = 0;
            let closedCount = 0;

            for (const pr of prs) {
              const hasLabel = pr.labels.some(label => label.name === LABEL_NAME);
              if (!hasLabel) continue;

              // Get all events for this PR
              const events = await github.paginate(github.rest.issues.listEvents, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100
              });

              // Find the most recent poor-quality label event
              const labelEvent = events
                .filter(e => e.event === 'labeled' && e.label?.name === LABEL_NAME)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];

              if (!labelEvent) {
                console.log(`PR #${pr.number}: No label event found, skipping`);
                continue;
              }

              const labeledAt = new Date(labelEvent.created_at);

              // Only the bot's own warning, posted since the latest
              // labelling, counts: a pull request labelled again is warned
              // again, and nobody else's comment starts the clock.
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100
              });
              const warningComment = comments
                .filter(c => c.user?.login === BOT
                  && c.body?.startsWith(WARNING_MARKER)
                  && new Date(c.created_at) >= labeledAt)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];

              if (!warningComment) {
                const closeOn = new Date(Date.now() + DAYS_THRESHOLD * 24 * 60 * 60 * 1000);
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: warning(closeOn)
                });
                console.log(`PR #${pr.number}: Warned, closes on ${closeOn.toISOString()} unless updated`);
                warnedCount++;
                continue;
              }

              // The warning itself may move updated_at to its own time, so
              // only a later update counts.
              const warnedAt = new Date(warningComment.created_at);
              const prUpdatedAt = new Date(pr.updated_at);

              if (prUpdatedAt > warnedAt) {
                console.log(`PR #${pr.number}: Updated after warning (${prUpdatedAt.toISOString()}), skipping`);
                continue;
              }

              if (warnedAt > cutoffDate) {
                const daysOld = Math.floor((Date.now() - warnedAt.getTime()) / (1000 * 60 * 60 * 24));
                console.log(`PR #${pr.number}: Warned only ${daysOld} days ago, needs ${DAYS_THRESHOLD} days`);
                continue;
              }

              console.log(`Closing PR #${pr.number} - labeled on ${labeledAt.toISOString()}, last updated ${prUpdatedAt.toISOString()}`);

              // Add closing comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `🚫 **This PR has been automatically closed.**

                It was marked as \`poor-quality\` more than ${DAYS_THRESHOLD} days ago and has not been updated to meet our contribution standards.

                **What happened:**
                - Labeled as poor-quality on: ${labeledAt.toLocaleDateString()}
                - No updates made to address the quality issues
                - Automatically closed after ${DAYS_THRESHOLD} day grace period

                **Want to revisit this?**
                - Review our [Contributing Guidelines](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CONTRIBUTING.md)
                - Address the quality issues that were identified
                - Open a new PR with the improvements

                Thank you for your interest in contributing! 🙏`
              });

              // Close the PR
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                state: 'closed'
              });

              closedCount++;
            }

            console.log(`Warned ${warnedCount} and closed ${closedCount} poor-quality PR(s)`);
