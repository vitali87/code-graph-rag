name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.0.484)"
        required: true

permissions: read-all

jobs:
  # code-graph-rag requires cgr-graph-rs (rust/cgr_graph_rs), so a crate
  # version PyPI lacks is built, tested and uploaded first.
  rust-version:
    name: Is this cgr-graph-rs on PyPI?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Validate dispatched tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "tag must match vMAJOR.MINOR.PATCH, got: $TAG"; exit 1; }

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Look the version up
        id: check
        run: |
          VERSION=$(grep -E '^version\s*=' rust/cgr_graph_rs/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::refusing malformed cgr-graph-rs version '$VERSION'"
            exit 1
          fi
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/cgr-graph-rs/$VERSION/json")
          case "$STATUS" in
            200) echo "publish=false" >> "$GITHUB_OUTPUT"; echo "cgr-graph-rs $VERSION is on PyPI." ;;
            404) echo "publish=true" >> "$GITHUB_OUTPUT"; echo "cgr-graph-rs $VERSION is new." ;;
            *) echo "::error::PyPI answered $STATUS for cgr-graph-rs $VERSION"; exit 1 ;;
          esac

  rust-wheels:
    name: Build cgr-graph-rs
    needs: rust-version
    if: needs.rust-version.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/rust-wheels.yml
    with:
      ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

  publish-rust:
    name: Publish cgr-graph-rs to PyPI
    needs: rust-wheels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download the wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cgr-graph-rs-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  publish:
    name: Publish to PyPI
    needs: [rust-version, publish-rust]
    # Only once the crate this release requires is on PyPI: already there,
    # or uploaded just now.
    if: >-
      !cancelled()
      && needs.rust-version.result == 'success'
      && (needs.rust-version.outputs.publish == 'false' || needs.publish-rust.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
