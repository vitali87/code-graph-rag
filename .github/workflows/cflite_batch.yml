# ClusterFuzzLite batch fuzzing.
#
# The PR workflow gives each harness a short budget against one change. This
# one runs them for far longer on a schedule, which is where anything needing
# more than a few hundred seconds of exploration actually turns up.

name: ClusterFuzzLite Batch

on:
  schedule:
    # 03:17 daily, off the hour to avoid the scheduler's peak.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  batch-fuzzing:
    name: Batch fuzz (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address]
    steps:
      - name: Build fuzzers (${{ matrix.sanitizer }})
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          sanitizer: ${{ matrix.sanitizer }}
          language: python

      - name: Run fuzzers (${{ matrix.sanitizer }})
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 3600
          mode: 'batch'
          sanitizer: ${{ matrix.sanitizer }}
          # `language` is a run_fuzzers input too, not only a build_fuzzers
          # one: cifuzz reads it as env.LANGUAGE and picks the per-language
          # reproduce timeout from it (python gets 120s, everything else the
          # 30s default). A PyInstaller-frozen Python target is slow to start,
          # so dropping this risks real crashes being written off as
          # unreproducible.
          language: python
