# ClusterFuzzLite on pull requests.
#
# Runs each harness in fuzz/ for a short budget against the PR's head, seeded
# from the corpus in fuzz/corpus/, and each cargo-fuzz target in
# rust/cgr_graph_rs/fuzz in a job of its own (see .clusterfuzzlite/build.sh for
# why a job builds one language). A crash fails the job with the reproducing
# input attached as an artifact.
#
# See https://google.github.io/clusterfuzzlite/

name: ClusterFuzzLite PR

on:
  pull_request:
    branches: [ "main" ]

permissions: read-all

# A new push to the same PR supersedes the queued or running run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzzing:
    name: Fuzz (${{ matrix.language }}, ${{ matrix.sanitizer }})
    # On our own servers when one has a free slot, on GitHub's
    # otherwise; forks and releases always on GitHub's: infra/runner-pool/README.md
    runs-on: >-
      ${{ vars.OWN_RUNNERS_FREE == 'true' && github.event_name != 'release'
      && !startsWith(github.ref, 'refs/tags/')
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && fromJSON('["self-hosted","own-linux"]') || 'ubuntu-latest' }}
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, rust]
        sanitizer: [address]
    steps:
      - name: Build fuzzers (${{ matrix.language }}, ${{ matrix.sanitizer }})
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          sanitizer: ${{ matrix.sanitizer }}
          language: ${{ matrix.language }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run fuzzers (${{ matrix.language }}, ${{ matrix.sanitizer }})
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: 'code-change'
          sanitizer: ${{ matrix.sanitizer }}
          # `language` is a run_fuzzers input too, not only a build_fuzzers
          # one: cifuzz reads it as env.LANGUAGE and picks the per-language
          # reproduce timeout from it (python gets 120s, everything else the
          # 30s default). A PyInstaller-frozen Python target is slow to start,
          # so dropping this risks real crashes being written off as
          # unreproducible.
          language: ${{ matrix.language }}
          output-sarif: true
