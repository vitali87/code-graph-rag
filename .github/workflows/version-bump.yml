name: Version Bump

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions: read-all

env:
  RELEASE_EVERY: 50

jobs:
  bump-version:
    name: Auto Version Bump
    if: >-
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, 'chore: bump version')
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          ssh-key: ${{ secrets.VERSION_BUMP_SSH_KEY }}

      - name: Check if version was manually changed
        id: check_manual
        run: |
          OLD_VERSION=$(git show HEAD^:pyproject.toml | grep -E '^version\s*=' | sed 's/version = "\(.*\)"/\1/')
          NEW_VERSION=$(grep -E '^version\s*=' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Version was manually changed from $OLD_VERSION to $NEW_VERSION, skipping auto-bump"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Get current version
        if: steps.check_manual.outputs.skip == 'false'
        id: get_version
        run: |
          CURRENT_VERSION=$(grep -E '^version\s*=' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "current=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Determine bump type
        if: steps.check_manual.outputs.skip == 'false'
        id: bump_type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ github.event.inputs.bump_type }}" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi

      - name: Bump version
        if: steps.check_manual.outputs.skip == 'false'
        id: bump_version
        run: |
          CURRENT="${{ steps.get_version.outputs.current }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "${{ steps.bump_type.outputs.type }}" in
            major)
              NEW_MAJOR=$((MAJOR + 1))
              NEW_VERSION="$NEW_MAJOR.0.0"
              ;;
            minor)
              NEW_MINOR=$((MINOR + 1))
              NEW_VERSION="$MAJOR.$NEW_MINOR.0"
              ;;
            patch)
              NEW_PATCH=$((PATCH + 1))
              NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
              ;;
          esac

          # MAJOR and MINOR are carried through from pyproject.toml's version
          # string unchanged (only PATCH passes through arithmetic), so a
          # crafted value there reaches every downstream `sed` that
          # interpolates this output into a shell command in this
          # write-enabled job. Refuse anything that is not three plain
          # numbers, once, here — rather than at each of the three use sites.
          # Bash pattern matching, not `grep -E`: grep anchors ^...$ per LINE,
          # so a value whose FIRST line is well-formed passes while carrying a
          # newline and a payload after it.
          if [[ ! "$NEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::refusing malformed version '$NEW_VERSION' from pyproject.toml"
            exit 1
          fi

          echo "new=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Bumping version from $CURRENT to $NEW_VERSION (type: ${{ steps.bump_type.outputs.type }})"

      - name: Decide whether this tag ships a release
        if: steps.check_manual.outputs.skip == 'false'
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || echo "")
          # A security patch must ship immediately rather than waiting for the
          # RELEASE_EVERY cadence (issue #1149). The triggering commit counts as
          # a security fix when its message carries a GHSA id (advisory-fork
          # merges do), an explicit [security] marker, or an associated pull
          # request labelled "security".
          MESSAGE=$(git log -1 --pretty=%B)
          GHSA=$(printf '%s' "$MESSAGE" | grep -oiE 'GHSA(-[0-9a-z]{4}){3}' | head -1 || true)
          SECURITY=false
          case "$MESSAGE" in
            *'[security]'*) SECURITY=true ;;
          esac
          if [ -n "$GHSA" ]; then
            SECURITY=true
          fi
          if [ "$SECURITY" != "true" ] && gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              --jq '.[].labels[].name' 2>/dev/null | grep -qx security; then
            SECURITY=true
          fi
          RELEASE=false
          if [ "$SECURITY" = "true" ]; then
            RELEASE=true
          elif [ -n "$LATEST" ]; then
            TAGS_SINCE=$(git ls-remote --tags origin "refs/tags/v*" \
              | awk -F'refs/tags/' '{print $2}' \
              | grep -v '\^{}' \
              | sort -V \
              | awk -v latest="$LATEST" 'seen {count++} $0 == latest {seen=1} END {print count + 0}')
            if [ $((TAGS_SINCE + 1)) -ge "$RELEASE_EVERY" ]; then
              RELEASE=true
            fi
          fi
          echo "release=$RELEASE" >> $GITHUB_OUTPUT
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          echo "security=$SECURITY" >> $GITHUB_OUTPUT
          echo "ghsa=$GHSA" >> $GITHUB_OUTPUT

      - name: Generate release notes
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # target_commitish lets the API build notes for a tag that does not
          # exist yet, so the news can be folded into the commit that gets
          # tagged below (issue #1146).
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="v${{ steps.bump_version.outputs.new }}" \
            -f target_commitish="${GITHUB_SHA}" \
            -f previous_tag_name="${{ steps.decide.outputs.latest }}" \
            --jq .body > /tmp/notes.md

      - name: Prepend security notice
        if: steps.decide.outputs.release == 'true' && steps.decide.outputs.security == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A security release must never ship silent notes: always prepend a
          # 🔒 Security section, enriched from the advisory when it is already
          # published, else a pointer to it. Guarantees the disclaimer even if
          # the advisory is published after the release is cut (issue #1149).
          GHSA="${{ steps.decide.outputs.ghsa }}"
          DETAIL=""
          if [ -n "$GHSA" ]; then
            DETAIL=$(gh api "repos/${GITHUB_REPOSITORY}/security-advisories/${GHSA}" \
              --jq '"\(.summary) (\(.severity) severity, CVSS \(.cvss.score // "n/a")), advisory [\(.ghsa_id)](https://github.com/'"${GITHUB_REPOSITORY}"'/security/advisories/\(.ghsa_id))\(if .cve_id then " / " + .cve_id else "" end)."' \
              2>/dev/null) || DETAIL=""
          fi
          {
            echo "## 🔒 Security"
            echo
            if [ -n "$DETAIL" ]; then
              echo "$DETAIL"
            elif [ -n "$GHSA" ]; then
              echo "This release contains a security fix; see advisory [$GHSA](https://github.com/${GITHUB_REPOSITORY}/security/advisories/$GHSA)."
            else
              echo "This release contains a security fix; see the [Security Advisories](https://github.com/${GITHUB_REPOSITORY}/security/advisories) page."
            fi
            echo
            echo "**Upgrading is strongly recommended.**"
            echo
          } > /tmp/security.md

      - name: Generate highlights
        if: steps.decide.outputs.release == 'true'
        continue-on-error: true
        env:
          HIGHLIGHTS_API_URL: ${{ secrets.HIGHLIGHTS_API_URL }}
          HIGHLIGHTS_API_TOKEN: ${{ secrets.HIGHLIGHTS_API_TOKEN }}
          HIGHLIGHTS_RESOLVE: ${{ secrets.HIGHLIGHTS_RESOLVE }}
        run: |
          # continue-on-error stays: a flaky highlights endpoint must not fail
          # a release. What it must not do is render every outcome as the same
          # green tick (issue #1605). Each exit below therefore records a
          # distinct outcome in the job summary, so "not configured", "the API
          # failed" and "it worked" are told apart at a glance instead of from
          # a log line that reads the same in all three cases.
          set -o pipefail
          note() { echo "- **Highlights:** $1" >> "$GITHUB_STEP_SUMMARY"; }
          # The step runs under `bash -e`, so with pipefail on, a curl or jq
          # failure aborts at the pipeline itself and no line after it runs.
          # Without this trap that abort would write no summary at all, which
          # is the silent-green failure this issue is about, just relocated.
          # ERR fires on the aborting command; the trap clears itself so the
          # deliberate `exit 1` below reports its own message instead.
          # The file is REMOVED as well as reported. A pipeline that fails
          # after its first stage emitted valid bullets leaves them on disk,
          # and because the next step also carries continue-on-error it would
          # then insert that half-written response into NEWS.md and the release
          # body. Reporting the failure without deleting the evidence of it
          # publishes output no stage vouched for.
          trap 'rm -f /tmp/highlights.md; note "FAILED, the highlights API call did not complete"' ERR
          if [ -z "$HIGHLIGHTS_API_URL" ]; then
            note 'skipped, HIGHLIGHTS_API_URL is not configured'
            exit 0
          fi
          RESOLVE_ARGS=()
          [ -n "$HIGHLIGHTS_RESOLVE" ] && RESOLVE_ARGS=(--resolve "$HIGHLIGHTS_RESOLVE")
          sed -E 's| by @[^ ]+ in https://[^ ]+||' /tmp/notes.md > /tmp/titles.md
          jq -n --rawfile notes /tmp/titles.md \
            '{model: "default", temperature: 0.3, max_tokens: 900, messages: [
              {role: "user", content: ("Write a \"## Highlights\" section for a software release: a markdown bullet list of 3 to 7 items, each line starting with \"* \" then a short bold theme followed by a colon, grouping the most important changes. Use British English. Never use em-dashes or en-dashes. Ground every claim strictly in the pull request titles below; do not invent anything. Output only the markdown section, starting with the line \"## Highlights\".\n\n" + $notes)}
            ]}' > /tmp/req.json
          curl -sf --max-time 1500 "${RESOLVE_ARGS[@]}" \
            -H "Authorization: Bearer ${HIGHLIGHTS_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d @/tmp/req.json \
            "${HIGHLIGHTS_API_URL}/v1/chat/completions" \
          | jq -er '.choices[0].message.content // empty' \
          | sed -e '/<think>/,/<\/think>/d' \
          | perl -CSD -pe 's/[\x{2014}\x{2013}]/-/g' > /tmp/highlights.md
          # `pipefail` rather than PIPESTATUS: a curl or jq failure is invisible
          # in $? because the pipeline's status is the LAST stage's, and
          # PIPESTATUS would work here but is clobbered by the next command
          # run, so a line inserted above this check would silently disable it.
          # The theme count below is a separate check and not redundant: the
          # redirection creates the file whether or not anything is written to
          # it, so its existence proves nothing, and a file with no themes in
          # it reaches update_news.py indistinguishably from a release that
          # genuinely had none.
          trap - ERR
          # Counted by ASKING THE PARSER, not by approximating it in grep. Two
          # rounds of review found two different mismatches in a hand-rolled
          # pattern: `^\*` missed dash bullets (undercount), then `^[-*] `
          # missed tabs (undercount), and `^[-*][[:space:]]+` accepted
          # `- **Theme**  text`, which BULLET_PATTERN rejects for having no
          # colon (overcount). A count that disagrees with the inserter in
          # either direction is a wrong number in the one line whose job is to
          # be right, so the number now comes from extract_bullets itself.
          # `|| true` and the `:-0` default keep a non-zero exit or empty
          # output from making the numeric test below a syntax error instead of
          # a failure report.
          themes=$(python3 -c 'import sys; sys.path.insert(0, "."); from scripts.update_news import extract_bullets; print(len(extract_bullets(open(sys.argv[1], encoding="utf-8").read())))' /tmp/highlights.md 2>/dev/null || true)
          themes=${themes:-0}
          # Emptiness and bulletlessness are one failure, not two. A model that
          # answers in prose, or returns an error string, produces a non-empty
          # file containing no themes -- which passes a `-s` test and would be
          # reported as a successful release that generated 0 themes. That is
          # the silent green this whole change exists to remove, so the count
          # decides, not the file size.
          if [ "$themes" -eq 0 ]; then
            note 'FAILED, the API returned no usable themes; NEWS.md will not change'
            exit 1
          fi
          # `[-*] ` and not `\*`: update_news.py's HIGHLIGHT_BULLET accepts both
          # markers, so counting only stars reports 0 themes on a dash-bulleted
          # response that NEWS.md then gains entries from -- this line existing
          # to prevent exactly that kind of confident wrong number. The trailing
          # space keeps an `*emphasis*` line from counting as a bullet, and
          # `|| true` rather than `|| echo 0` because grep -c already prints 0
          # when it matches nothing; echoing another splits the summary in two.
          note "generated $themes theme(s)"

      - name: Install uv
        if: steps.decide.outputs.release == 'true'
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Update NEWS.md
        id: update_news
        if: steps.decide.outputs.release == 'true'
        continue-on-error: true
        run: |
          # News is derived from the generated Highlights rather than a second
          # model call: a dedicated news prompt that carried the previous NEWS
          # entries as dedup context made the model paraphrase those old entries
          # into fake news (v0.0.720), while the Highlights for the same run
          # were accurate. update_news.py normalises the bullet marker, drops
          # non-feature themes, and dedups against NEWS.md; every remaining
          # highlight becomes a news entry.
          # A NEWS.md change without the README re-render would drift from the
          # generate-README pre-commit hook, so revert both if the render fails.
          # update_news.py already reports "parsed N, deduped N, inserted N"
          # and exits 1 when bullet-shaped lines fail to parse (#1605). That
          # exit code is swallowed by continue-on-error, which is wanted -- a
          # dead highlights endpoint must not fail a release -- but it must not
          # also be unobservable, so the outcome is recorded either way.
          if news_out=$(python3 scripts/update_news.py /tmp/highlights.md 2>&1); then
            # The "parsed/deduped/inserted" line, not the last line: the last
            # line is "no new themes to add" on a quiet release and "added: ..."
            # on a busy one, and neither distinguishes a working parser from a
            # dead one. The counts are what #1605 added for exactly that.
            counts=$(printf '%s\n' "$news_out" | grep -m1 '^parsed ' || true)
            echo "- **NEWS.md:** ${counts:-$news_out}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **NEWS.md:** FAILED, $news_out" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "$news_out"
          # The README re-render is its OWN step below, without
          # continue-on-error: here a generator failure was the condition of
          # the recovery block, the checkout succeeded, the step exited 0 and
          # the release shipped stale generated docs (issue #1971). Only the
          # news derivation is tolerated; the render must not be.
          if git diff --quiet NEWS.md; then
            echo "news_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "news_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate README from the updated NEWS.md
        if: steps.decide.outputs.release == 'true' && steps.update_news.outputs.news_changed == 'true'
        run: |
          # A NEWS.md change without the README re-render would drift from the
          # generate-README pre-commit hook, so revert both if the render
          # fails -- and then FAIL: the generator exits 1 when a generated
          # section reaches no marker (#1969), and that safeguard has to stop
          # the release rather than be swallowed (issue #1971).
          if ! (uv sync --frozen && uv run --frozen python scripts/generate_readme.py); then
            git checkout -- NEWS.md README.md
            echo "- **README:** re-render FAILED; NEWS.md and README.md restored, release stopped" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Update pyproject.toml
        if: steps.check_manual.outputs.skip == 'false'
        run: |
          sed -i 's/^version = ".*"/version = "${{ steps.bump_version.outputs.new }}"/' pyproject.toml

      - name: Update server.json
        if: steps.check_manual.outputs.skip == 'false'
        run: |
          sed -i 's/"version": "[^"]*"/"version": "${{ steps.bump_version.outputs.new }}"/g' server.json

      # uv.lock carries its own copy of the project version. Left behind, it
      # disagrees with pyproject.toml on committed main (`uv lock --check`
      # fails on a clean checkout), and every clone then shows a spurious
      # one-line diff the moment any uv command resolves the workspace
      # (issue #1432). Rewritten in place rather than via `uv lock` because uv
      # is installed only on release runs while this bump runs on every push,
      # and because re-resolving here could pull in unrelated dependency
      # updates that no one reviewed.
      #
      # Scoped to the `[[package]]` stanza whose name is code-graph-rag, and
      # to whichever line in it holds the version, so no dependency's version
      # can match. A `sed` that assumed `version` follows `name` would keep
      # working today and silently no-op the day uv emits another field
      # between them, failing during a release with the stale value committed.
      # The step therefore ASSERTS the result instead of trusting the edit.
      - name: Update uv.lock project version
        if: steps.check_manual.outputs.skip == 'false'
        env:
          NEW_VERSION: ${{ steps.bump_version.outputs.new }}
        run: |
          python3 - <<'PY'
          import os, re, sys

          new = os.environ["NEW_VERSION"]
          path = "uv.lock"
          text = open(path, encoding="utf-8").read()

          # Split on stanza boundaries and rewrite only the project's own.
          # Counts the version lines PRESENT rather than the ones replaced: a
          # capped substitution would rewrite the first of two and report
          # success, committing a lockfile that names two versions.
          version_re = re.compile(r'^version = "[^"]*"$', re.M)
          stanzas = text.split("[[package]]")
          hits = 0
          for i, stanza in enumerate(stanzas):
              if not re.search(r'^name = "code-graph-rag"$', stanza, re.M):
                  continue
              found = len(version_re.findall(stanza))
              if found != 1:
                  sys.exit(f"project stanza has {found} version lines, expected 1")
              stanzas[i] = version_re.sub(f'version = "{new}"', stanza)
              hits += found

          if hits != 1:
              sys.exit(f"expected exactly 1 project version line, rewrote {hits}")

          open(path, "w", encoding="utf-8").write("[[package]]".join(stanzas))

          # Re-read and re-locate the stanza rather than pattern-matching a
          # name-then-version adjacency: the rewrite above deliberately does
          # not assume that order, so a check that does would fail a release
          # whose output was correct.
          written = [
              stanza
              for stanza in open(path, encoding="utf-8").read().split("[[package]]")
              if re.search(r'^name = "code-graph-rag"$', stanza, re.M)
          ]
          if len(written) != 1:
              sys.exit(f"expected 1 project stanza after rewrite, found {len(written)}")
          versions = version_re.findall(written[0])
          if versions != [f'version = "{new}"']:
              sys.exit(f"uv.lock project version is not {new} after rewrite: {versions}")
          print(f"uv.lock project version set to {new}")
          PY
          git diff --stat uv.lock || true

      - name: Commit version bump
        if: steps.check_manual.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml server.json uv.lock NEWS.md README.md
          git commit -m "chore: bump version to ${{ steps.bump_version.outputs.new }}"
          git push

      - name: Require successful CI for the release source
        if: steps.decide.outputs.release == 'true'
        timeout-minutes: 50
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_WAIT_ATTEMPTS: 90
        run: |
          set -euo pipefail
          # The bump has already been pushed. CI must cover its source commit,
          # not the chore commit generated above or a newer tip of main.
          if [[ "$GITHUB_REF" != refs/heads/main ||
                "$(git rev-parse HEAD^)" != "$GITHUB_SHA" ]]; then
            echo "::error::Release source is not the triggering main commit"
            exit 1
          fi
          WORKFLOW_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml" \
            --jq 'select(.path == ".github/workflows/ci.yml" and .state == "active") | .id')
          if [[ ! "$WORKFLOW_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Could not identify the active CI workflow"
            exit 1
          fi
          for ((attempt=1; attempt<=CI_WAIT_ATTEMPTS; attempt++)); do
            RUNS=$(gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_ID}/runs?head_sha=${GITHUB_SHA}&event=push&branch=main&per_page=100")
            if ! STATE=$(jq -er --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" \
              --argjson workflow "$WORKFLOW_ID" '
              if type != "array" or length == 0 or
                 any(.[]; (.workflow_runs | type) != "array" or
                           (.total_count | type) != "number") then
                error("Invalid CI workflow runs response")
              else . end
              | if ([.[].workflow_runs[]] | length) != .[0].total_count then
                  error("Incomplete CI workflow runs response")
                else . end
              | [.[].workflow_runs[] | select(
                  .workflow_id == $workflow and .path == ".github/workflows/ci.yml" and
                  .head_sha == $sha and .head_branch == "main" and .event == "push" and
                  .repository.full_name == $repo and .head_repository.full_name == $repo)]
              | if any(.[]; (.id | type) != "number" or .id <= 0 or
                            (.run_attempt | type) != "number" or .run_attempt <= 0) then
                  error("Missing CI run identity")
                else . end
              | max_by([.id, .run_attempt])
              | if . == null then "missing"
                elif .status == "completed" then (.conclusion // "invalid")
                elif .status == "queued" or .status == "in_progress" or
                     .status == "pending" or .status == "waiting" or
                     .status == "requested" then "pending"
                else "invalid" end' <<< "$RUNS"); then
              echo "::error::Could not validate complete CI run evidence for ${GITHUB_SHA}; refusing release (see jq error above)"
              exit 1
            fi
            case "$STATE" in
              success)
                echo "CI succeeded for release source ${GITHUB_SHA}"
                exit 0
                ;;
              missing|pending)
                echo "Waiting for CI at ${GITHUB_SHA} (${STATE}, attempt ${attempt}/${CI_WAIT_ATTEMPTS})"
                ;;
              *)
                echo "::error::CI at ${GITHUB_SHA} concluded ${STATE}; refusing release"
                exit 1
                ;;
            esac
            if (( attempt < CI_WAIT_ATTEMPTS )); then
              sleep 30
            fi
          done
          echo "::error::Timed out waiting for successful CI at ${GITHUB_SHA}; refusing release"
          exit 1

      - name: Create git tag
        if: steps.check_manual.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "v${{ steps.bump_version.outputs.new }}"
          if [ "${{ steps.decide.outputs.release }}" = "true" ]; then
            git push origin "v${{ steps.bump_version.outputs.new }}"
          else
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "v${{ steps.bump_version.outputs.new }}"
          fi

      - name: Create release
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.bump_version.outputs.new }}"
          : > /tmp/body.md
          # The 🔒 Security disclaimer must lead the release body, above the
          # AI highlights and the generated changelog (issue #1149).
          [ -s /tmp/security.md ] && cat /tmp/security.md >> /tmp/body.md
          [ -s /tmp/highlights.md ] && cat /tmp/highlights.md >> /tmp/body.md
          cat /tmp/notes.md >> /tmp/body.md
          gh release create "$TAG" --title "$TAG" --notes-file /tmp/body.md --verify-tag \
            || gh release edit "$TAG" --notes-file /tmp/body.md
