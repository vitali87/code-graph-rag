name: Language support
description: Report a parser gap or request support for a programming language.
title: "[Language]: "
labels:
  - language support

body:
  - type: input
    id: language
    attributes:
      label: Language and version
      placeholder: "Example: C# 12"
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Minimal source example
      description: Provide a small representative source file or snippet.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected graph or parser behavior
      description: Describe the definitions, references, relationships, or syntax that should be recognized.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Current behavior
      description: Describe what is missing, incorrect, or failing.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Code Graph RAG version or commit
      placeholder: "Example: v1.2.0 or abc1234"

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add parser errors, related language issues, or references.
