name: Bug report
description: Report a reproducible problem in Code Graph RAG.
title: "[Bug]: "
labels:
  - bug
  - needs triage

body:
  - type: markdown
    attributes:
      value: |
        Before submitting, search existing issues for duplicates. Do not include
        secrets, API keys, passwords, or private source code.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Clearly describe the problem and its impact.
      placeholder: Tell us what went wrong.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: Describe the correct behavior.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest command, code sample, repository, or sequence of steps that reproduces the problem.
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or traceback
      description: Paste the complete relevant error output and remove secrets or private data.
      render: shell

  - type: input
    id: version
    attributes:
      label: Code Graph RAG version or commit
      placeholder: "Example: v1.2.0 or abc1234"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - macOS
        - Linux
        - Windows
        - Docker
        - Other
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "Example: 3.12.6"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add screenshots, configuration details, or related issues.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed secrets and private information.
          required: true
