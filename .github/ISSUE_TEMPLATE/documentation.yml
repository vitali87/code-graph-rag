name: Documentation issue
description: Report missing, unclear, or incorrect documentation.
title: "[Docs]: "
labels:
  - documentation

body:
  - type: input
    id: location
    attributes:
      label: Documentation location
      description: Link to the page or identify the file and section.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
      description: Explain what a reader cannot understand or do.
    validations:
      required: true

  - type: textarea
    id: improvement
    attributes:
      label: Suggested improvement
      description: Describe the correction or addition you recommend.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, screenshots, or related issues.
