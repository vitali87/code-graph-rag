[project]
name = "code-graph-rag"
version = "0.4.14"
description = "The ultimate RAG for your monorepo. Query, understand, and edit multi-language codebases with the power of AI and knowledge graphs"
readme = "PYPI_README.md"
requires-python = ">=3.12"
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "knowledge-graph",
    "code-analysis",
    "tree-sitter",
    "mcp",
    "mcp-server",
    "llm",
    "graph-database",
    "semantic-search",
    "codebase",
    "memgraph",
    "developer-tools",
    "monorepo",
]
dependencies = [
    "loguru>=0.7.3",
    # codebase_rag/mcp/server.py registers its handlers through the 2.x
    # Server constructor, which 1.x lacks, and every documented install
    # resolves this range rather than uv.lock (#2519).
    "mcp>=2.3.0,<3",
    # The MCP server checks tool arguments against their input schemas, which
    # the 1.x SDK did for it.
    "jsonschema>=4.20.0",
    # Only the providers codebase_rag/providers imports. The `pydantic-ai`
    # meta-package also installs logfire, evals, a CLI and a web UI, none used.
    "pydantic-ai-slim[anthropic,google,openai]>=2.0.0",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "tiktoken>=0.12.0",
    "tomli-w>=1.2.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter==0.26.0",
    "watchdog>=6.0.0",
    "typer>=0.21.1",
    "rich>=14.2.0",
    "prompt-toolkit>=3.0.52",
    "diff-match-patch>=20241021",
    "click>=8.3.3",
    "protobuf>=6.33.5",
    "defusedxml>=0.7.1",
    "huggingface-hub[hf-xet]>=1.7.2",
    "pathspec>=1.0.4",
    "pygments>=2.20.0",
    # certifi is the CA bundle httpx and requests verify against; 2026.10.23
    # is the first without the distrusted eMudhra roots. Declared so an
    # upgrade over an older install moves it too.
    "certifi>=2026.10.23",
    # The embedded graph's `=~`: unlike `re`, a match takes a timeout, so a
    # backtracking pattern stops at the query's deadline. tiktoken already
    # installs it.
    "regex>=2024.11.6",
    # The embedded graph's Rust acceleration (rust/cgr_graph_rs), shipped as
    # abi3 wheels for exactly these platforms; elsewhere the engine runs its
    # Python twin of every part. The floor is the crate version this code
    # was written against, raised with each crate release.
    "cgr-graph-rs>=0.1.4,<0.2; platform_python_implementation == 'CPython' and ((sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')) or sys_platform == 'darwin' or (sys_platform == 'win32' and platform_machine == 'AMD64'))",
]

[project.scripts]
code-graph-rag = "codebase_rag.cli:app"
cgr = "codebase_rag.cli:app"

[project.entry-points.pytest11]
cgr_trace = "codebase_rag.trace.pytest_plugin"

[tool.uv]
package = true
# semgrep (dev group) pins pyjwt~=2.13.0, which holds the single locked PyJWT
# below the 2.14.0 fix for GHSA-ffc3-869f-jxw9 and its sibling advisories.
# Drop this once a semgrep release accepts pyjwt>=2.14.0.
# semgrep also pins mcp==1.29.0, below both the 1.30.0 fix for
# GHSA-84m7-p3x7-pcfv (StreamableHTTP sessions never reclaimed) and the 2.x
# SDK the server is written for. Its own CLI imports the 1.x FastMCP, so
# `semgrep` cannot start in this environment until a release accepts mcp 2.
# Drop that entry once one does.
# semgrep also pins opentelemetry-api, -sdk and -exporter-otlp-proto-http
# ~=1.37.0, which holds the locked API below the 1.45.1 fix for
# GHSA-xcq7-p3pf-p88h (quadratic tracestate parsing). The SDK and exporter pin
# the API exactly, so all three move together. Drop these entries once a
# semgrep release accepts opentelemetry-api>=1.45.1.
override-dependencies = [
    "pyjwt[crypto]>=2.14.0",
    "mcp>=2.3.0,<3",
    "opentelemetry-api>=1.45.1,<2",
    "opentelemetry-sdk>=1.45.1,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1,<2",
]

# Patched grammars: upstream tree-sitter-c drops declarations after a
# #define whose value embeds a block comment (issue #555). Our forks carry
# the repeat(preproc_arg) fix; drop these overrides once upstream releases it.
[tool.uv.sources]
# A checkout builds the crate it carries (with a Rust toolchain), so the
# Python and Rust halves of a change are tested together; installs from
# PyPI get the published wheels.
cgr-graph-rs = { path = "rust/cgr_graph_rs" }
tree-sitter-c = { git = "https://github.com/vitali87/tree-sitter-c", rev = "fa327ad98f847f8173fc46926be4165c7971f960" }
tree-sitter-cpp = { git = "https://github.com/vitali87/tree-sitter-cpp", rev = "b4a7be2f62f36dd460a14b2d1728d42d81d2c486" }

[tool.setuptools.packages.find]
include = ["codebase_rag*", "codec*", "cgr*"]
exclude = ["*.tests", "*.tests.*"]

[tool.setuptools.package-data]
codebase_rag = [
    "docker-compose.yaml",
    "parsers/csharp_frontend/roslyn/*.cs",
    "parsers/csharp_frontend/roslyn/*.csproj",
    "parsers/go_frontend/gotypes/*.go",
    "parsers/go_frontend/gotypes/go.mod",
    "parsers/go_frontend/gotypes/go.sum",
    "parsers/java_frontend/javac/cgr/*.java",
    "parsers/ast_grep_patterns/*.yaml",
    "analyzers/ast_grep_rules/*/*.yaml",
    # Julia's pip grammar ships no HIGHLIGHTS_QUERY, so its highlights come
    # only from this fallback file; without it the wheel silently disables
    # Julia modifier/decorator extraction (issue #1882 review).
    "queries/highlights/*.scm",
]
# The provenance manifest hashes this file to stamp each index with its codec
# schema; without it every installed build writes a null hash and
# `cgr diff-index` refuses its indexes (issue #2399).
codec = ["schema.proto"]

[project.optional-dependencies]
test = [
    "jedi>=0.19",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.8.0",
    "testcontainers>=4.9.0",
    "libclang>=18.1.1",
    "filelock>=3.12",
    "ast-grep-py>=0.51.0",
    "pyyaml>=6.0",
    # The suite exercises the Memgraph backend with a mocked server, but
    # imports the real driver's exception types to do it.
    "pymgclient>=1.6.0",
    # The `sqlite` vector store's tests run against a real sqlite-vec file.
    "sqlite-vec>=0.1.9",
]

cpp = [
    "libclang>=18.1.1",
]

# Memgraph is an optional backend since the embedded graph became the
# default (issue #386). Its driver is a C extension that builds with cmake
# wherever no wheel fits, the setup step first-time users tripped on.
# TransientError, which the ingestor retries, first appears in 1.6.0.
memgraph = [
    "pymgclient>=1.6.0",
]

# Neo4j is an optional backend (issue #1590), so a default install must not
# pay for a driver it will never load.
neo4j = [
    "neo4j>=5.28.1",
]

treesitter-full = [
    "tree-sitter-python>=0.23.6",
    "tree-sitter-javascript>=0.23.1",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-rust>=0.24.0",
    "tree-sitter-go>=0.23.4",
    "tree-sitter-scala>=0.24.0",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-c>=0.24.1",
    "tree-sitter-cpp>=0.23.0",
    "tree-sitter-lua>=0.0.19",
    "tree-sitter-julia>=0.23.1",
    "tree-sitter-php>=0.24.1",
    "tree-sitter-c-sharp>=0.23.5",
    # Exact pin: PyPI's tree-sitter-dart is a single-maintainer repackaging of
    # a fork, so a new release is a new publisher decision, not a grammar fix.
    "tree-sitter-dart==0.1.0",
    "tree-sitter-sql>=0.3.11",
    "tree-sitter-markdown>=0.5.1",
]

# sqlite-vec is the default vector store's, on the platforms it ships wheels
# for (it has no sdist), which cover every one torch ships wheels for; no
# marker tells musl from glibc, and torch has no musl wheels either.
# qdrant-client is for CGR_VECTOR_STORE_BACKEND=qdrant, the default before it.
semantic = [
    "qdrant-client>=1.9.0",
    # The gRPC client verifies TLS against grpcio's own roots.pem; 1.84.1 is
    # the first without emSign ECC Root CA - G3.
    "grpcio>=1.84.1",
    "sqlite-vec>=0.1.9; (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')) or sys_platform == 'darwin' or (sys_platform == 'win32' and platform_machine == 'AMD64')",
    "torch>=2.6.0",
    "transformers>=5.0.0",
]

milvus = [
    "pymilvus[milvus-lite]>=3.0.0",
    # As in `semantic`: pymilvus's gRPC client trusts grpcio's roots.pem.
    "grpcio>=1.84.1",
]

# The default `sqlite` vector store alone, for an install that computes its
# embeddings elsewhere (CGR_EMBEDDING_PROVIDER=openai): vectors in a file
# beside the embedded graph, so semantic search needs no server either.
sqlite-vec = [
    "sqlite-vec>=0.1.9",
]

ast-grep = [
    "ast-grep-py>=0.51.0",
    "pyyaml>=6.0",
]
python-semantics = [
    "jedi>=0.19",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["codec/", "benchmarks/", "optimize/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "PL", "T201", "S"]
ignore = [
    "E501",     # line too long
    "PLR2004",  # magic value comparison (too noisy)
    "PLC0415",  # import not at top-level (intentional lazy imports)
    "PLR0913",  # too many arguments (often unavoidable)
    "PLR0917",  # too many positional arguments (often unavoidable)
    "PLR0911",  # too many return statements
    "PLR0912",  # too many branches
    "PLR0915",  # too many statements
    "PLW2901",  # loop variable overwritten (intentional for .strip())
    "PLW0603",  # global statement (singleton pattern)
    "S101",     # assert (Bandit skips B101 too)
    "S105",     # password-by-name heuristic: fires on *_TOKEN / PASS_* constants; secret scanning covers real secrets
    "S106",     # same heuristic for keyword arguments
    "S107",     # same heuristic for argument defaults
    "S603",     # any subprocess call with an argv list; the shell=True rules (S602, S604, S605) stay on
    "S607",     # toolchains resolve from PATH by design; shutil.which reads the same PATH
]

[tool.ruff.lint.per-file-ignores]
# Tests are outside Bandit's and SonarCloud's security scope too.
"**/tests/**" = ["T201", "S"]
"benchmarks/**" = ["T201"]
"evals/flows_corpus/**" = ["T201"]
# The corpus builder is a CLI script; its output is the point.
"fuzz/build_corpus.py" = ["T201"]
# The embedded graph engine compiles Cypher to SQL, so composing SQL text is
# its job. Identifiers in that text are generated by the compiler and string
# literals pass through `sql_str`; every value supplied with a query reaches
# SQLite as a bound parameter, never spliced into the statement.
"codebase_rag/embedded_graph/**" = ["S608"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = ["codebase_rag/tests/test_cypher_queries.py", "codebase_rag/tests/test_code_retrieval.py", "codebase_rag/tests/test_call_resolver.py", "benchmarks/", "optimize/"]

[tool.coverage.run]
# `codebase_rag/constants/` is excluded because coverage cannot say anything
# useful about it, not because it is untested (issue #1599).
#
# Those 31 modules are almost entirely module-level assignments. A constant
# definition executes exactly once, at import, and cannot fail to execute if
# the module is imported at all -- so the measurement is 100% or 0% depending
# on whether tracing had started by then, never on whether anything is tested.
# Measured under pytest it is 0/2858 lines, because conftest imports
# `graph_updater` (which alone pulls all 31) during collection, before
# pytest-cov begins tracing. Importing the same package after starting
# coverage manually records the lines normally.
#
# Keeping it in the denominator understated source coverage by ~2856 lines and
# made `constants/` read as the largest gap in the tree while carrying no
# signal in either direction. Excluding it makes the remaining figure mean
# something; it does not hide dead code, since an unused constant executes at
# import exactly like a used one and coverage could never have flagged it.
#
# This is not a new judgement: `sonar-project.properties` already carries
# `sonar.coverage.exclusions=...,codebase_rag/constants/**`. The two tools
# disagreed, and this makes Codecov match the call the project had made.
omit = ["codebase_rag/constants/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# loadgroup honors the xdist_group marker that pins the integration dir to
# one worker; for unmarked tests it schedules identically to the default.
# xdist workers decide their grouping flag from the parsed args/ini before
# any conftest hook fires (xdist remote.py setup_config), so this must be
# an ini-level option; every dependency set that carries pytest also
# carries pytest-xdist, so the flag always parses. The shard plugin
# registers `--shard`, which CI uses to split the suite across jobs
# (codebase_rag/tests/suite_shards.py says why it is not a conftest hook).
addopts = "--dist=loadgroup -p codebase_rag.tests.suite_shards"
testpaths = ["codebase_rag/tests"]
norecursedirs = ["grammars", ".git", "__pycache__", "*.egg-info", ".venv", "venv"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (may download models or require external services)",
    "integration: marks tests as integration tests requiring Docker",
    "e2e: marks tests as end-to-end tests",
]

[dependency-groups]
dev = [
    "bandit>=1.9.2",
    "coverage>=7.13.0",
    "pre-commit>=4.2.0",
    "pyinstaller>=6.14.1",
    "pytest>=9.0.2",
    "pytest-xdist>=3.8.0",
    # ty resolves the Memgraph driver's types where the code names them.
    "pymgclient>=1.6.0",
    "ruff>=0.5.5",
    "semgrep>=1.79.0",
    "ty>=0.0.7",
    "types-protobuf>=5.0.0",
]
docs = [
    # Exact pin while Zensical is pre-1.0.
    "zensical==0.0.72",
]
fuzz = [
    "atheris>=2.3.0",
]
# Builds the cgr-graph-rs wheels (.github/workflows/rust-wheels.yml): zig
# links each Linux wheel against the oldest glibc or musl its tag promises.
rust-wheels = [
    "maturin==1.15.0",
    # Only the Linux wheels are linked with zig, and it ships no Windows build.
    "ziglang==0.17.0; sys_platform == 'linux'",
]

[tool.bandit]
exclude_dirs = ["codebase_rag/tests", "scripts", "benchmarks", "optimize"]
skips = ["B101"]
